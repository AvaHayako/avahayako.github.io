body {

/* ---------- FILTER BUTTONS ---------- */

.filters {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.filters button {
  background: linear-gradient(145deg, #fcfff1, #e6f5ad);
  color: #3d4a2a;

  border: 1px solid rgba(120, 150, 90, 0.35);
  border-radius: 12px;

  padding: 10px 18px;
  margin: 6px;

  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0.3px;

  cursor: pointer;

  box-shadow: 0 4px 10px rgba(90, 120, 60, 0.15);

  transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.2s ease;
}

.filters button:hover {
  transform: translateY(-2px);
  background: linear-gradient(145deg, #eefaa8, #dff08f);
  box-shadow: 0 6px 10px rgba(250, 255, 101, 0.432);
  
}

.filters button.active {
  background: linear-gradient(145deg, #eaf7a8, #d6ea7d);
  border: 1px solid rgba(90, 120, 60, 0.5);
  box-shadow: 0 6px 10px rgba(250, 255, 101, 0.304);
  transform: translateY(-1px);
}

/* ---------- GALLERY GRID ---------- */

.gallery {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 30px;

  /* max-width: 1100px; */

  margin: 10 auto;
}

.gallery img {
  width: 100%;
  height: auto;
  display: block;
  border-radius: 10px;
  
  /* box-shadow: 0 8px 18px rgba(250, 255, 101, 0.612); */
  box-shadow: 0 8px 18px rgba(0, 0, 0, 0.612);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.gallery img:hover {
  transform: scale(1.05) !important;

  box-shadow:
    0 0 10px rgba(250, 255, 101, 0.9),
    0 0 25px rgba(250, 255, 101, 0.6),
    0 0 45px rgba(250, 255, 101, 0.35),
    0 12px 30px rgba(0, 0, 0, 0.35) !important;

  z-index: 2;
  position: relative;
}

@media (max-width: 900px) {
  .gallery {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media (max-width: 600px) {
  .gallery {
    grid-template-columns: 1fr;
  }
}

/* ---------- VIDEO STYLING ---------- */

.video-thumb {
  position: relative;
  width: 100%;
  width:220px;
  height: 392px;
}

.video-thumb img {
  width: 100%;
  height:100%;
  display: block;
  border-radius: 10px;
  object-fit: fill;
  transition: transform 0.2s ease, filter 0.2s ease;
}

/* hover effect */
.youtube-item:hover img {
  transform: scale(1.02);
  filter: brightness(0.85);
  box-shadow: 0 8px 18px rgba(250, 255, 101, 0.612);

}

/* play button */
.play-button {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);

  width: 55px;
  height: 55px;

  background: rgba(0, 0, 0, 0.55);
  color: white;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 50%;

  font-size: 20px;
  padding-left: 3px;

  pointer-events: none;
}

/* hover animation */
.youtube-item:hover .play-button {
  transform: translate(-50%, -50%) scale(1.05);
  background: rgba(0, 0, 0, 0.7);
  box-shadow: 0 8px 18px rgba(250, 255, 101, 0.612);

}
